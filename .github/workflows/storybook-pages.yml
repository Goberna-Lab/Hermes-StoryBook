# Publica el Storybook estático en GitHub Pages en cada push a master.
# URL resultante: https://goberna-lab.github.io/Hermes-StoryBook/
#
# Corre en runners hosteados por GitHub (no en los self-hosted de VPS1): es un
# build estático sin secretos ni acceso a infra, y así no compite por los
# runners de capacidad fija de los productos.
name: Storybook → GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si llegan dos pushes seguidos, el último gana.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # `storybook build` genera storybook-static/ con rutas relativas
      # (`base: './'` en vite.config.ts), así que sirve bajo el subpath
      # /Hermes-StoryBook/ de Pages sin configuración extra.
      - run: npx storybook build --quiet

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
